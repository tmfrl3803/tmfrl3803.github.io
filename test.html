<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심리 테스트</title>
    <style>
        :root {
            font-size: 16px; /* 기본 폰트 크기 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            padding: 2vw;
        }

        #start, #restart {
            padding: 0.8rem 1.6rem;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            cursor: pointer;
            margin: 2vh 0;
            border: none;
            background-color: #007BFF;
            color: white;
            border-radius: 5px;
        }

        #intro {
            font-size: clamp(1rem, 3vw, 1.2rem);
            text-align: center;
            margin: 2vh 0;
            min-height: 4vh;
            width: min(90vw, 500px);
        }

        #countdown {
            font-size: clamp(2rem, 8vw, 3rem);
            text-align: center;
            min-height: 4vh;
            margin: 2vh 0;
            width: min(90vw, 500px);
        }

        #hint {
            width: min(90vw, 500px);
            height: 1.5rem;
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .hint-arrow {
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            color: green;
            width: 33.33%;
            text-align: center;
        }

        #word-container {
            width: min(90vw, 500px);
            height: clamp(3rem, 10vw, 4rem);
            display: flex;
            align-items: center;
            background-color: #fff;
            border: 1px solid #ccc;
            margin: 2vh 0;
            padding-left: 0.8rem;
            padding-right: 0.8rem;
        }

        #word {
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            width: 100%;
        }

        #input-container {
            display: flex;
            align-items: center;
            width: min(90vw, 500px);
        }

        #input {
            width: min(70vw, 400px);
            padding: 0.6rem;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            margin-right: 0.5rem;
            opacity: 0;
            transition: opacity 0.3s;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #ox {
            width: 1.5rem;
            height: 1.5rem;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            line-height: 1.5rem;
            text-align: center;
        }

        #progress {
            font-size: clamp(1rem, 3vw, 1.2rem);
            margin: 1vh 0;
        }

        #result {
            display: none;
            text-align: center;
            width: min(90vw, 500px);
        }

        #result h2 {
            font-size: clamp(1.5rem, 4vw, 1.8rem);
            margin-bottom: 2vh;
        }

        #chart {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: clamp(10rem, 40vw, 12rem);
            width: min(90vw, 400px);
            margin: 2vh auto;
            border-bottom: 2px solid #000;
            border-left: 2px solid #000;
        }

        .bar {
            width: clamp(1.5rem, 5vw, 2rem);
            background-color: #4CAF50;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .bar-label {
            position: absolute;
            bottom: -1.2rem;
            font-size: clamp(0.7rem, 2vw, 0.8rem);
        }

        .bar-value {
            position: absolute;
            top: -1.2rem;
            font-size: clamp(0.7rem, 2vw, 0.8rem);
        }

        /* 반응형 미디어 쿼리 */
        @media (max-width: 600px) {
            body {
                padding: 4vw;
            }
            #start, #restart {
                width: 80vw;
            }
            #input-container {
                flex-direction: column;
                align-items: flex-start;
            }
            #input {
                width: 80vw;
                margin-right: 0;
                margin-bottom: 1vh;
            }
            #ox {
                align-self: center;
            }
        }
    </style>
</head>
<body>
    <button id="start">시작</button>
    <div id="intro">↓ 아래 네모칸에 0.03초 동안 나오는 단어를 맞춰보세요!</div>
    <div id="progress"></div>
    <div id="countdown"></div>
    <div id="hint">
        <span class="hint-arrow" id="hint-left"></span>
        <span class="hint-arrow" id="hint-center"></span>
        <span class="hint-arrow" id="hint-right"></span>
    </div>
    <div id="word-container">
        <div id="word"></div>
    </div>
    <div id="input-container">
        <input type="text" id="input" placeholder="단어 입력 후, enter">
        <div id="ox"></div>
    </div>
    <div id="result">
        <h2>테스트 결과</h2>
        <div id="chart"></div>
        <p id="interpretation"></p>
        <button id="restart">다시 시작</button>
    </div>

    <script>
        // 주제별 단어 목록 (각 주제당 20개, 총 100개)
        const words = {
            relationship: [
                '친구', '가족', '사랑', '외로움', '소통', 
                '동료', '연인', '이웃', '동창', '직장', 
                '학교', '사회', '모임', '파티', '축제', 
                '여행', '휴가', '취미', '운동', '게임'
            ],
            success: [
                '성취', '목표', '승리', '노력', '성장', 
                '도전', '경쟁', '승진', '자격', '인증', 
                '수상', '명예', '존경', '칭찬', '인정', 
                '평가', '피드백', '개선', '발전', '혁신'
            ],
            money: [
                '부자', '가난', '저축', '지출', '투자', 
                '재산', '수입', '예산', '절약', '낭비', 
                '빚', '대출', '이자', '세금', '보험', 
                '연금', '퇴직', '은퇴', '유산', '기부'
            ],
            food: [
                '배고픔', '식사', '요리', '간식', '다이어트', 
                '영양', '칼로리', '지방', '단백질', '탄수화물', 
                '비타민', '미네랄', '수분', '알레르기', '식중독', 
                '위생', '청결', '신선', '유통기한', '보관'
            ],
            health: [
                '운동', '질병', '치료', '예방', '웰빙', 
                '체력', '정신', '스트레스', '불안', '우울', 
                '수면', '휴식', '명상', '요가', '마사지', 
                '스파', '온천', '목욕', '샤워', '청소'
            ]
        };

        // 문제 생성 함수
        function generateQuestions() {
            const questions = [];
            const categories = ['relationship', 'success', 'money', 'food', 'health'];

            // 각 주제에서 6개의 단어 랜덤 선택
            categories.forEach(category => {
                const categoryWords = words[category];
                const selectedWords = [];
                while (selectedWords.length < 6) {
                    const randomIndex = Math.floor(Math.random() * categoryWords.length);
                    const word = categoryWords[randomIndex];
                    if (!selectedWords.includes(word)) {
                        selectedWords.push(word);
                    }
                }
                selectedWords.forEach(word => {
                    questions.push({ word, category });
                });
            });

            // 문제 순서 섞기 (Fisher-Yates 알고리즘)
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }

            return questions;
        }

        // 전역 변수
        let questions = [];
        let currentQuestionIndex = 0;
        let correctAnswers = {
            relationship: 0,
            success: 0,
            money: 0,
            food: 0,
            health: 0
        };
        let canSubmit = false;
        let lastAnswerCorrect = null;

        // DOM 요소
        const startButton = document.getElementById('start');
        const introDiv = document.getElementById('intro');
        const countdownDiv = document.getElementById('countdown');
        const hintDiv = document.getElementById('hint');
        const hintLeft = document.getElementById('hint-left');
        const hintCenter = document.getElementById('hint-center');
        const hintRight = document.getElementById('hint-right');
        const wordDiv = document.getElementById('word');
        const input = document.getElementById('input');
        const oxDiv = document.getElementById('ox');
        const progressDiv = document.getElementById('progress');
        const resultDiv = document.getElementById('result');
        const chartDiv = document.getElementById('chart');
        const interpretationDiv = document.getElementById('interpretation');
        const restartButton = document.getElementById('restart');

        // 테스트 시작
        startButton.addEventListener('click', startTest);
        restartButton.addEventListener('click', startTest);

        function startTest() {
            questions = generateQuestions();
            currentQuestionIndex = 0;
            correctAnswers = { relationship: 0, success: 0, money: 0, food: 0, health: 0 };
            lastAnswerCorrect = null;
            startButton.style.display = 'none';
            introDiv.style.display = 'none';
            resultDiv.style.display = 'none';
            input.style.display = 'block';
            progressDiv.style.display = 'block';
            countdownDiv.style.display = 'block';
            hintDiv.style.display = 'flex';
            wordDiv.parentElement.style.display = 'flex';
            input.value = '';
            input.style.opacity = '0';
            oxDiv.innerText = '';
            canSubmit = false;
            showQuestion();
        }

        // 문제 표시
        function showQuestion() {
            if (currentQuestionIndex >= questions.length) {
                showResult();
                return;
            }
            progressDiv.innerText = `${currentQuestionIndex + 1}/30`;
            input.style.opacity = '0';
            input.value = '';
            canSubmit = false;
            // OX 표시 업데이트
            if (currentQuestionIndex > 0) {
                oxDiv.innerText = lastAnswerCorrect ? '○' : '✗';
                oxDiv.style.color = lastAnswerCorrect ? 'green' : 'red';
            } else {
                oxDiv.innerText = '';
            }
            const question = questions[currentQuestionIndex];
            showCountdown(question.word);
        }

        // 카운트다운 표시
        function showCountdown(word) {
            // 힌트 화살표 표시
            const alignments = ['left', 'center', 'right'];
            const selectedAlignment = alignments[Math.floor(Math.random() * alignments.length)];
            const otherAlignments = alignments.filter(align => align !== selectedAlignment);
            const hintAlignments = [selectedAlignment, otherAlignments[Math.floor(Math.random() * otherAlignments.length)]];
            hintLeft.innerText = hintAlignments.includes('left') ? '↓' : '';
            hintCenter.innerText = hintAlignments.includes('center') ? '↓' : '';
            hintRight.innerText = hintAlignments.includes('right') ? '↓' : '';

            let count = 3;
            countdownDiv.innerText = count;
            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownDiv.innerText = count;
                } else {
                    clearInterval(interval);
                    countdownDiv.innerText = '';
                    showWord(word, selectedAlignment);
                }
            }, 1000);
        }

        // 단어 표시 (0.03초)
        function showWord(word, alignment) {
            wordDiv.style.textAlign = alignment;
            wordDiv.innerText = word;
            setTimeout(() => {
                wordDiv.innerText = '';
                hintLeft.innerText = '';
                hintCenter.innerText = '';
                hintRight.innerText = '';
                input.style.opacity = '1';
                input.focus();
                canSubmit = true;
            }, 30); // 0.03초
        }

        // Enter 키로 답변 확인
        input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && canSubmit) {
                checkAnswer();
            }
        });

        // 답변 확인
        function checkAnswer() {
            const userAnswer = input.value.trim();
            const correctAnswer = questions[currentQuestionIndex].word;
            lastAnswerCorrect = userAnswer === correctAnswer;
            if (lastAnswerCorrect) {
                const category = questions[currentQuestionIndex].category;
                correctAnswers[category]++;
            }
            currentQuestionIndex++;
            showQuestion();
        }

        // 결과 표시
        function showResult() {
            input.style.display = 'none';
            progressDiv.style.display = 'none';
            countdownDiv.style.display = 'none';
            hintDiv.style.display = 'none';
            wordDiv.parentElement.style.display = 'none';
            resultDiv.style.display = 'block';

            // 가장 많이 맞춘 카테고리 찾기
            let maxCategory = '';
            let maxCount = 0;
            for (const category in correctAnswers) {
                if (correctAnswers[category] > maxCount) {
                    maxCount = correctAnswers[category];
                    maxCategory = category;
                }
            }

            let resultText = '';
            switch (maxCategory) {
                case 'relationship': resultText = '타인과의 관계'; break;
                case 'success': resultText = '성공'; break;
                case 'money': resultText = '돈'; break;
                case 'food': resultText = '음식'; break;
                case 'health': resultText = '건강'; break;
            }

            // 막대 그래프 생성
            chartDiv.innerHTML = '';
            const categories = [
                { key: 'relationship', label: '관계', count: correctAnswers.relationship },
                { key: 'success', label: '성공', count: correctAnswers.success },
                { key: 'money', label: '돈', count: correctAnswers.money },
                { key: 'food', label: '음식', count: correctAnswers.food },
                { key: 'health', label: '건강', count: correctAnswers.health }
            ];

            categories.forEach(category => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = `${category.count * clamp(1.5rem, 5vw, 2rem)}`; // 반응형 높이
                bar.innerHTML = `
                    <span class="bar-value">${category.count}</span>
                    <span class="bar-label">${category.label}</span>
                `;
                chartDiv.appendChild(bar);
            });

            // 결과 해석
            interpretationDiv.innerText = `당신이 가장 잘 맞춘 카테고리는 '${resultText}'입니다. 이는 당신이 ${resultText}에 대한 결핍을 느낄 수 있음을 시사합니다. (참고: 이 테스트는 재미용입니다.)`;
        }
    </script>
</body>
</html>
