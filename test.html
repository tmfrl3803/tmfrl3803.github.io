<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심리 테스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #start {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            margin-bottom: 20px;
            border: none;
            background-color: #007BFF;
            color: white;
            border-radius: 5px;
            pointer-events: auto;
            position: relative;
            z-index: 100;
        }
        #intro {
            font-size: 18px;
            text-align: center;
            margin: 20px 0;
            min-height: 60px;
            width: 90%;
            max-width: 500px;
        }
        #countdown {
            font-size: 48px;
            text-align: center;
            min-height: 60px;
            margin: 20px 0;
            width: 90%;
            max-width: 500px;
        }
        #hint {
            width: 90%;
            max-width: 500px;
            height: 20px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .hint-arrow {
            font-size: 18px;
            color: green;
            width: 33.33%;
            text-align: center;
        }
        #word-container {
            width: 90%;
            max-width: 500px;
            height: 50px;
            display: flex;
            align-items: center;
            background-color: #fff;
            border: 1px solid #ccc;
            margin: 20px 0;
            padding-left: 15px; /* 여백 증가 */
            padding-right: 15px; /* 여백 증가 */
        }
        #word {
            font-size: 24px;
            width: 100%;
            opacity: 1;
            visibility: visible;
        }
        #input-container {
            display: flex;
            align-items: center;
            width: 90%;
            max-width: 500px;
        }
        #input {
            width: 70%;
            max-width: 400px;
            padding: 10px;
            font-size: 16px;
            margin-right: 10px;
            opacity: 0;
            transition: opacity 0.3s;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #ox {
            width: 20px;
            height: 20px;
            font-size: 16px;
            line-height: 20px;
            text-align: center;
        }
        #progress {
            font-size: 18px;
            margin: 10px 0;
        }
        #result {
            display: none;
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        #result h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        #chart {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 200px;
            width: 90%;
            max-width: 400px;
            margin: 20px auto;
            border-bottom: 2px solid #000;
            border-left: 2px solid #000;
        }
        .bar {
            width: 40px;
            background-color: #4CAF50;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .bar-label {
            position: absolute;
            bottom: -20px;
            font-size: 12px;
        }
        .bar-value {
            position: absolute;
            top: -20px;
            font-size: 12px;
        }
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            #start {
                width: 90%;
                max-width: 400px;
            }
            #input-container {
                flex-direction: column;
                align-items: center;
            }
            #input {
                width: 90%;
                max-width: 400px;
                margin-right: 0;
                margin-bottom: 10px;
            }
            #ox {
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>
    <button id="start">시작</button>
    <div id="intro">↓ 아래 네모칸에 0.03초 동안 나오는 단어를 맞춰보세요!</div>
    <div id="progress"></div>
    <div id="countdown"></div>
    <div id="hint">
        <span class="hint-arrow" id="hint-left"></span>
        <span class="hint-arrow" id="hint-center"></span>
        <span class="hint-arrow" id="hint-right"></span>
    </div>
    <div id="word-container">
        <div id="word"></div>
    </div>
    <div id="input-container">
        <input type="text" id="input" placeholder="단어 입력 후, enter">
        <div id="ox"></div>
    </div>
    <div id="result">
        <h2>테스트 결과</h2>
        <div id="chart"></div>
        <p id="interpretation"></p>
        <button id="restart">다시 시작</button>
    </div>

    <script>
        const words = {
            relationship: [
                '친구', '가족', '사랑', '외로움', '소통', 
                '동료', '연인', '이웃', '동창', '직장', 
                '학교', '사회', '모임', '파티', '축제', 
                '여행', '휴가', '취미', '운동', '게임'
            ],
            success: [
                '성취', '목표', '승리', '노력', '성장', 
                '도전', '경쟁', '승진', '자격', '인증', 
                '수상', '명예', '존경', '칭찬', '인정', 
                '평가', '피드백', '개선', '발전', '혁신'
            ],
            money: [
                '부자', '가난', '저축', '지출', '투자', 
                '재산', '수입', '예산', '절약', '낭비', 
                '빚', '대출', '이자', '세금', '보험', 
                '연금', '퇴직', '은퇴', '유산', '기부'
            ],
            food: [
                '배고픔', '식사', '요리', '간식', '다이어트', 
                '영양', '칼로리', '지방', '단백질', '탄수화물', 
                '비타민', '미네랄', '수분', '알레르기', '식중독', 
                '위생', '청결', '신선', '유통기한', '보관'
            ],
            health: [
                '운동', '질병', '치료', '예방', '웰빙', 
                '체력', '정신', '스트레스', '불안', '우울', 
                '수면', '휴식', '명상', '요가', '마사지', 
                '스파', '온천', '목욕', '샤워', '청소'
            ]
        };

        function generateQuestions() {
            const questions = [];
            const categories = ['relationship', 'success', 'money', 'food', 'health'];
            categories.forEach(category => {
                const categoryWords = words[category];
                const selectedWords = [];
                while (selectedWords.length < 6) {
                    const randomIndex = Math.floor(Math.random() * categoryWords.length);
                    const word = categoryWords[randomIndex];
                    if (!selectedWords.includes(word)) {
                        selectedWords.push(word);
                    }
                }
                selectedWords.forEach(word => {
                    questions.push({ word, category });
                });
            });
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }
            return questions;
        }

        let questions = [];
        let currentQuestionIndex = 0;
        let correctAnswers = {
            relationship: 0,
            success: 0,
            money: 0,
            food: 0,
            health: 0
        };
        let canSubmit = false;
        let lastAnswerCorrect = null;

        const startButton = document.getElementById('start');
        const introDiv = document.getElementById('intro');
        const countdownDiv = document.getElementById('countdown');
        const hintDiv = document.getElementById('hint');
        const hintLeft = document.getElementById('hint-left');
        const hintCenter = document.getElementById('hint-center');
        const hintRight = document.getElementById('hint-right');
        const wordDiv = document.getElementById('word');
        const input = document.getElementById('input');
        const oxDiv = document.getElementById('ox');
        const progressDiv = document.getElementById('progress');
        const resultDiv = document.getElementById('result');
        const chartDiv = document.getElementById('chart');
        const interpretationDiv = document.getElementById('interpretation');
        const restartButton = document.getElementById('restart');

        startButton.addEventListener('click', startTest);
        restartButton.addEventListener('click', startTest);

        function startTest() {
            questions = generateQuestions();
            currentQuestionIndex = 0;
            correctAnswers = { relationship: 0, success: 0, money: 0, food: 0, health: 0 };
            lastAnswerCorrect = null;
            startButton.style.display = 'none';
            introDiv.style.display = 'none';
            resultDiv.style.display = 'none';
            input.style.display = 'block';
            progressDiv.style.display = 'block';
            countdownDiv.style.display = 'block';
            hintDiv.style.display = 'flex';
            wordDiv.parentElement.style.display = 'flex';
            input.value = '';
            input.style.opacity = '0';
            oxDiv.innerText = '';
            wordDiv.innerText = ''; // 단어 초기화
            wordDiv.style.opacity = '1'; // 표시 보장
            canSubmit = false;
            showQuestion();
        }

        function showQuestion() {
            if (currentQuestionIndex >= questions.length) {
                showResult();
                return;
            }
            progressDiv.innerText = `${currentQuestionIndex + 1}/30`;
            input.style.opacity = '0';
            input.value = '';
            canSubmit = false;
            if (currentQuestionIndex > 0) {
                oxDiv.innerText = lastAnswerCorrect ? '○' : '✗';
                oxDiv.style.color = lastAnswerCorrect ? 'green' : 'red';
            } else {
                oxDiv.innerText = '';
                wordDiv.innerText = ''; // 첫 문제 초기화
                wordDiv.style.opacity = '1';
            }
            const question = questions[currentQuestionIndex];
            showCountdown(question.word);
        }

        function showCountdown(word) {
            const alignments = ['left', 'center', 'right'];
            const selectedAlignment = alignments[Math.floor(Math.random() * alignments.length)];
            const otherAlignments = alignments.filter(align => align !== selectedAlignment);
            const hintAlignments = [selectedAlignment, otherAlignments[Math.floor(Math.random() * otherAlignments.length)]];
            hintLeft.innerText = hintAlignments.includes('left') ? '↓' : '';
            hintCenter.innerText = hintAlignments.includes('center') ? '↓' : '';
            hintRight.innerText = hintAlignments.includes('right') ? '↓' : '';

            let count = 3;
            countdownDiv.innerText = count;
            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownDiv.innerText = count;
                } else {
                    clearInterval(interval);
                    countdownDiv.innerText = '';
                    showWord(word, selectedAlignment);
                }
            }, 1000);
        }

        function showWord(word, alignment) {
            wordDiv.style.textAlign = alignment;
            wordDiv.style.opacity = '1';
            wordDiv.innerText = word;
            console.log(`Displaying word: ${word}`); // 디버깅
            requestAnimationFrame(() => {
                setTimeout(() => {
                    wordDiv.innerText = '';
                    wordDiv.style.opacity = '1';
                    hintLeft.innerText = '';
                    hintCenter.innerText = '';
                    hintRight.innerText = '';
                    input.style.opacity = '1';
                    input.focus();
                    canSubmit = true;
                    console.log('Word cleared'); // 디버깅
                }, 30);
            });
        }

        input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && canSubmit) {
                checkAnswer();
            }
        });

        function checkAnswer() {
            const userAnswer = input.value.trim();
            const correctAnswer = questions[currentQuestionIndex].word;
            lastAnswerCorrect = userAnswer === correctAnswer;
            if (lastAnswerCorrect) {
                const category = questions[currentQuestionIndex].category;
                correctAnswers[category]++;
            }
            currentQuestionIndex++;
            showQuestion();
        }

        function showResult() {
            input.style.display = 'none';
            progressDiv.style.display = 'none';
            countdownDiv.style.display = 'none';
            hintDiv.style.display = 'none';
            wordDiv.parentElement.style.display = 'none';
            resultDiv.style.display = 'block';

            let maxCategory = '';
            let maxCount = 0;
            for (const category in correctAnswers) {
                if (correctAnswers[category] > maxCount) {
                    maxCount = correctAnswers[category];
                    maxCategory = category;
                }
            }

            let resultText = '';
            switch (maxCategory) {
                case 'relationship': resultText = '타인과의 관계'; break;
                case 'success': resultText = '성공'; break;
                case 'money': resultText = '돈'; break;
                case 'food': resultText = '음식'; break;
                case 'health': resultText = '건강'; break;
            }

            chartDiv.innerHTML = '';
            const categories = [
                { key: 'relationship', label: '관계', count: correctAnswers.relationship },
                { key: 'success', label: '성공', count: correctAnswers.success },
                { key: 'money', label: '돈', count: correctAnswers.money },
                { key: 'food', label: '음식', count: correctAnswers.food },
                { key: 'health', label: '건강', count: correctAnswers.health }
            ];

            categories.forEach(category => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = `${category.count * 30}px`;
                bar.innerHTML = `
                    <span class="bar-value">${category.count}</span>
                    <span class="bar-label">${category.label}</span>
                `;
                chartDiv.appendChild(bar);
            });

            interpretationDiv.innerText = `당신이 가장 잘 맞춘 카테고리는 '${resultText}'입니다. 이는 당신이 ${resultText}에 대한 결핍을 느낄 수 있음을 시사합니다. (참고: 이 테스트는 재미용입니다.)`;
        }
    </script>
</body>
</html>
